name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Windows does not record the executable bit, so set it here.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit, database and screenshot tests
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "grindhaus-0.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: grindhaus-debug-apk
          path: grindhaus-*.apk
          retention-days: 30

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30

      # Only green builds of main become releases: a plain .apk the phone can install.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" "grindhaus-0.1.${GITHUB_RUN_NUMBER}.apk" \
            --title "Grindhaus 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "$COMMIT_MESSAGE" \
            --target "$GITHUB_SHA"